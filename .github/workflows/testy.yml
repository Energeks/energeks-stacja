name: Testy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testy:
    name: Testy specyfikacji (Node i Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testy bez zależności
        run: node test/test.js
      - name: Walidacja schematem JSON
        run: |
          python3 -m pip install --quiet "jsonschema>=4.18" referencing
          python3 test/test_schemat.py
